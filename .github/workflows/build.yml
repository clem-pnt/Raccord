name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl file cmake ninja-build g++ pkg-config \
            qt6-base-dev qt6-base-dev-tools libqt6opengl6-dev qt6-multimedia-dev qt6-l10n-tools qt6-tools-dev-tools \
            libgl-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev \
            libebur128-dev zlib1g-dev catch2 xvfb xauth libgl1-mesa-dri dpkg-dev patchelf
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRACCORD_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build
      - name: Tests
        run: cd build && xvfb-run -a ctest --output-on-failure
      - name: AppImage
        run: |
          mkdir -p .tools
          curl -fL -o .tools/appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x .tools/appimagetool-x86_64.AppImage
          packaging/build-appimage.sh build
      - name: Debian package
        run: packaging/build-deb.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: raccord-linux
          path: |
            build/*.deb
            build/*.AppImage
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.deb
            build/*.AppImage
